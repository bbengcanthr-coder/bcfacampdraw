/* ============================================================
   style.css — กระดาษขาว หมึกดำ สีมาจากดินสอของผู้เล่นเท่านั้น
   layout: แอปหน้าเดียว — กระดาษวาดคือพระเอก เครื่องมือเกาะขอบจอ
   ============================================================ */
:root {
  --paper: #ffffff;
  --ink: #1e1e1e;
  --ink-2: #57564f;
  --ink-3: #9d9b93;
  --rule: #e2e0d8;
  --wash: #f7f6f2;
  --font-display: "Wadkhen", "Thonburi", "Leelawadee UI", "Noto Sans Thai", sans-serif;
  --font-body: "Wadkhen", "Thonburi", "Leelawadee UI", "Noto Sans Thai", sans-serif;
  --gap: clamp(8px, 1.8vmin, 20px);
  --bar: 52px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
body {
  font-family: var(--font-body);
  font-size: 21px;
  line-height: 1.35;
  -webkit-text-stroke: 0.3px currentColor;
  -webkit-font-smoothing: antialiased;
}
button, a { font: inherit; color: inherit; -webkit-text-stroke: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }

#app { position: fixed; inset: 0; overflow: hidden; }
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: max(env(safe-area-inset-top), 6px) max(env(safe-area-inset-right), 14px) max(env(safe-area-inset-bottom), 12px) max(env(safe-area-inset-left), 14px);
}
.screen.on { display: flex; animation: screenIn 0.32s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- เส้นวาด (doodle) ---------- */
.dd { position: relative; display: inline-block; flex: none; pointer-events: none; }
.dd > canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; visibility: hidden; }
html[data-f="0"] .dd > canvas.f0,
html[data-f="1"] .dd > canvas.f1,
html[data-f="2"] .dd > canvas.f2 { visibility: visible; }
.boilt { display: inline-block; }
html[data-f="1"] .boilt { transform: translate(0.4px, -0.35px) rotate(-0.22deg); }
html[data-f="2"] .boilt { transform: translate(-0.35px, 0.4px) rotate(0.18deg); }

/* ---------- ปุ่ม ---------- */
.bar { height: var(--bar); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-spacer { width: 48px; }
.icon-btn {
  position: relative; width: 48px; height: 48px; flex: none;
  border: 0; background: none; padding: 0; border-radius: 12px;
  display: grid; place-items: center;
  transition: transform 0.12s, opacity 0.2s;
}
.icon-btn .dd { width: 30px; height: 30px; }
.icon-btn:active:not(:disabled) { transform: scale(0.9) rotate(-4deg); }
.icon-btn:disabled { opacity: 0.25; }
.btn {
  position: relative; border: 0; background: none;
  min-height: 54px; padding: 6px 24px 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 25px; line-height: 1.1; text-decoration: none; white-space: nowrap;
  transition: transform 0.12s, opacity 0.2s;
}
.btn > span { position: relative; padding-top: 4px; }
.btn .bg { position: absolute; inset: 0; }
.btn .ic { width: 24px; height: 24px; }
.btn.primary { -webkit-text-stroke: 0.7px currentColor; }
.btn.big { font-size: clamp(28px, 7vw, 36px); min-height: 66px; padding: 8px 34px 12px; gap: 12px; }
.btn.big .ic { width: 30px; height: 30px; }
.btn.sm { font-size: 21px; min-height: 48px; padding: 4px 16px 8px; }
.btn.sm .ic { width: 20px; height: 20px; }
.btn:active:not(:disabled) { transform: translateY(1px) rotate(-0.8deg) scale(0.98); }
.btn:disabled { opacity: 0.3; }
:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

/* ---------- หน้าแรก ---------- */
.home-main {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(6px, 2.2vh, 24px); text-align: center; padding-bottom: 4vh;
}
.scene { width: min(620px, 96vw); height: min(calc(min(620px, 96vw) * 0.406), 27vh); }
.title {
  margin: 0; font-weight: 400; font-family: var(--font-display);
  font-size: clamp(50px, min(14vw, 12.5vh), 112px); line-height: 1.04;
  -webkit-text-stroke: 1.3px currentColor; text-wrap: balance;
}
.title > span { display: block; }
.title .t2 { position: relative; padding-bottom: 0.08em; }
.squig { position: absolute; left: 4%; right: 4%; bottom: -0.1em; height: 0.24em; }
.sub { margin: 0; color: var(--ink-2); font-size: clamp(18px, 4.4vw, 24px); }
.teaser { display: flex; gap: clamp(8px, 3vw, 18px); align-items: center; opacity: 0.85; }
.t-ic { width: clamp(30px, 8vw, 42px); height: clamp(30px, 8vw, 42px); }
.teaser-tx { margin: -6px 0 0; color: var(--ink-3); font-size: 18px; }

/* ---------- หน้าวาด ---------- */
.steps { display: flex; gap: 6px; }
.step { width: 26px; height: 26px; }
.play { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
.ref { flex: none; display: flex; align-items: center; gap: 14px; padding: 0 2px; }
.ref-card { position: relative; flex: none; width: clamp(80px, min(34vw, 16vh), 170px); aspect-ratio: 1; }
.ref-art { position: absolute; inset: 7%; }
.ref-frame { position: absolute; inset: 0; }
.ref-name {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0 0.28em;
  font-size: clamp(24px, 6.2vw, 36px); line-height: 1.2; -webkit-text-stroke: 0.6px currentColor;
}
.ref-name .plus { width: 0.6em; height: 0.6em; }
.stage { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; }
.paper { position: relative; width: 300px; height: 300px; touch-action: none; cursor: crosshair; }
.paper > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.paper > canvas.ink { visibility: hidden; }
html[data-f="0"] .paper > canvas.f0,
html[data-f="1"] .paper > canvas.f1,
html[data-f="2"] .paper > canvas.f2 { visibility: visible; }
.paper .frame { position: absolute; inset: 0; }
.hint {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--ink-3); font-size: clamp(22px, 5vw, 30px); pointer-events: none; transition: opacity 0.3s;
}
.hint.off { opacity: 0; }
.note { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; opacity: 0; transition: opacity 0.2s; }
.listening .note { opacity: 1; animation: bob 0.6s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-6px) rotate(8deg); } }
.tools { flex: none; display: flex; flex-direction: column; gap: 6px; transition: opacity 0.25s; }
.colors { display: flex; justify-content: space-between; }
.sw {
  position: relative; border: 0; background: none; padding: 0;
  width: clamp(34px, 10vw, 50px); height: clamp(34px, 10vw, 50px);
  transition: transform 0.12s;
}
.sw .dd { position: absolute; inset: 0; }
.sw .ring { opacity: 0; transition: opacity 0.15s; }
.sw[aria-checked="true"] .ring { opacity: 1; }
.sw:active { transform: scale(0.88); }
.acts { display: flex; align-items: center; gap: 4px; }
.acts .done { margin-left: auto; }
.listening .colors, .listening #undoBtn, .listening #clearBtn, .listening #sizeBtn { opacity: 0.22; pointer-events: none; }
.shake { animation: shake 0.4s; }
@keyframes shake { 20% { transform: translateX(-6px) rotate(-2deg); } 40% { transform: translateX(6px) rotate(2deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* แนวนอน (ไอแพด/คอม/มือถือตะแคง) */
@media (min-aspect-ratio: 6/5) {
  .play {
    display: grid; align-items: center;
    grid-template-columns: minmax(150px, 1fr) minmax(0, 3fr) minmax(120px, 1fr);
    grid-template-rows: minmax(0, 1fr);
  }
  .stage { height: 100%; width: 100%; }
  .ref { flex-direction: column; text-align: center; justify-self: center; gap: 12px; max-width: 100%; }
  .ref-card { width: clamp(110px, min(19vw, 34vh), 260px); }
  .ref-name { justify-content: center; flex-direction: column; font-size: clamp(24px, min(2.6vw, 5vh), 40px); }
  .tools { justify-self: center; align-items: center; gap: 14px; }
  .colors { display: grid; grid-template-columns: repeat(3, auto); gap: 4px; }
  .sw { width: clamp(36px, min(4.2vw, 7.5vh), 56px); height: clamp(36px, min(4.2vw, 7.5vh), 56px); }
  .acts { flex-wrap: wrap; justify-content: center; max-width: 180px; }
  .acts .done { margin: 6px 0 0; width: 100%; }
}
@media (min-aspect-ratio: 6/5) and (max-height: 520px) {
  :root { --bar: 44px; }
  .ref-card { width: clamp(80px, 26vh, 150px); }
  .ref-name { font-size: 22px; }
  .sw { width: 34px; height: 34px; }
  .icon-btn { width: 42px; height: 42px; }
  .btn.primary.done { min-height: 46px; }
}

/* ---------- หน้าผลรางวัล ---------- */
.res {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
  display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 3vh, 28px);
  padding: 0 2px 20px; text-align: center;
}
.res-top, .res-side { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.4vh, 22px); width: 100%; max-width: 640px; }
.score-wrap { display: flex; flex-direction: column; align-items: center; }
.score-lbl { color: var(--ink-2); font-size: 24px; }
.score { font-size: clamp(120px, min(40vw, 28vh), 260px); line-height: 0.95; -webkit-text-stroke: 2.4px currentColor; font-variant-numeric: tabular-nums; min-width: 2.2ch; }
.prize { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0; transform: translateY(8px) scale(0.96); transition: opacity 0.45s, transform 0.45s cubic-bezier(.2,1.4,.4,1); }
.prize.show { opacity: 1; transform: none; }
.prize-art { width: clamp(170px, 52vw, 280px); height: clamp(90px, 26vw, 140px); }
.prize-title { font-size: clamp(34px, 9vw, 50px); line-height: 1.1; -webkit-text-stroke: 1px currentColor; }
.prize-item { font-size: clamp(21px, 5vw, 26px); color: var(--ink-2); }
.ladder { display: flex; justify-content: center; gap: clamp(4px, 2vw, 14px); }
.rung { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 6px 4px; min-width: 56px; color: var(--ink-3); font-size: 21px; }
.rung .dd.r-ic { width: 32px; height: 32px; opacity: 0.55; }
.rung .ring { position: absolute; inset: -2px -4px; opacity: 0; }
.rung.on { color: var(--ink); }
.rung.on .r-ic { opacity: 1; }
.rung.on .ring { opacity: 1; }
.gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(6px, 2vw, 14px); }
.thumb {
  position: relative; border: 0; background: none; padding: 0;
  width: clamp(92px, min(27vw, 17vh), 160px); display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 16px; color: var(--ink-2); line-height: 1.15;
}
.thumb .t-box { position: relative; width: 100%; aspect-ratio: 1; }
.thumb .t-box .dd { position: absolute; inset: 0; }
.thumb .t-box .t-art { inset: 5%; }
.thumb:active { transform: scale(0.96); }
.res-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
@media (min-aspect-ratio: 6/5) and (min-width: 760px) {
  .res { flex-direction: row; justify-content: center; align-items: center; gap: clamp(24px, 5vw, 80px); }
  .res-top { max-width: 420px; }
  .res-side { max-width: 560px; }
}

/* ---------- แผ่นป๊อปอัป ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
  background: rgba(255, 255, 255, 0.9);
  padding: max(env(safe-area-inset-top), 14px) 14px max(env(safe-area-inset-bottom), 14px);
}
.sheet.on { display: grid; animation: screenIn 0.25s ease-out; }
.sheet-card {
  position: relative; background: var(--paper);
  width: min(520px, 100%); max-height: 100%; overflow: auto;
  padding: 18px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.sheet-card > .bg { position: absolute; inset: 0; }
.sheet-card.small { width: min(360px, 100%); }
.sheet-card .x { position: absolute; right: 6px; top: 6px; z-index: 2; }
.v-name { font-size: 26px; padding: 6px 44px 0; -webkit-text-stroke: 0.6px currentColor; text-align: center; }
.v-art { position: relative; width: min(440px, 78vw, 54vh); aspect-ratio: 1; }
.v-art > .dd { position: absolute; inset: 0; }
.v-over { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.v-ref { position: absolute; right: -4px; bottom: -4px; width: 26%; aspect-ratio: 1; background: var(--paper); border-radius: 50%; }
.v-ref .dd { position: absolute; inset: 10%; }
.v-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.ex-img { display: block; max-width: 100%; max-height: 56vh; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; pointer-events: auto; position: relative; margin-top: 34px; }
.ex-hint { margin: 0; color: var(--ink-2); font-size: 18px; position: relative; }
.q-text { margin: 8px 0 4px; font-size: 26px; text-align: center; position: relative; line-height: 1.3; }
.q-text small { font-size: 18px; color: var(--ink-2); }

.toast {
  position: fixed; left: 50%; bottom: max(env(safe-area-inset-bottom), 18px); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  padding: 8px 20px 12px; background: var(--paper); font-size: 21px; white-space: nowrap;
  transition: opacity 0.2s, transform 0.25s;
}

@media (prefers-reduced-motion: reduce) {
  .screen.on, .sheet.on { animation: none; }
  .listening .note { animation: none; }
  .prize { transition: none; }
}

<div id="app">

  <!-- หน้าแรก -->
  <section class="screen on" id="home" aria-label="หน้าแรก">

      <div class="teaser" aria-label="ของรางวัล">

      </div>

    </main>
  </section>

  <!-- หน้าวาด -->
  <section class="screen" id="game" aria-label="วาดภาพ">
    <header class="bar">
      <button class="icon-btn" type="button" id="quitBtn" aria-label="ออกจากเกม"><i class="dd" data-d="close"></i></button>
      <div class="steps" id="steps" aria-label="ความคืบหน้า"></div>
      <button class="icon-btn snd" type="button" aria-label="เปิดปิดเสียง"><i class="dd" data-d="soundOn"></i></button>
    </header>
    <div class="play">
      <div class="ref">
        <div class="ref-card"><i class="dd ref-art" id="refArt" data-d="ref"></i><i class="dd ref-frame" data-d="frame" data-soft="1"></i></div>

          <i class="dd frame" data-d="frame"></i>

<script>
/* ============================================================
   engine.js — เครื่องยนต์เส้นดินสอ
   - สุ่มแบบกำหนดค่าได้ (deterministic) + noise
   - แปลง SVG path เป็นจุด (polyline)
   - Builder สำหรับประกอบภาพวาดเส้นเป็น "องค์ประกอบ"
   - เส้นสั่น (wobble) + เส้นเดือด (line boil) 3 เฟรม
   - เนื้อดินสอฝุ่น (grain texture) ด้วย CanvasPattern
   ============================================================ */
(function () {
  const WD = (globalThis.WD = globalThis.WD || {});

  /* ---------- สุ่มแบบคงที่ ---------- */
  function hash(n) {
    n = (n | 0) ^ 0x9e3779b9;
    n = Math.imul(n ^ (n >>> 16), 0x85ebca6b);
    n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35);
    n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  }
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function noise1(x, seed) {
    const i = Math.floor(x), f = x - i;
    const a = hash(i * 374761 + seed * 668265 + 17);
    const b = hash((i + 1) * 374761 + seed * 668265 + 17);
    const u = f * f * (3 - 2 * f);
    return (a + (b - a) * u) * 2 - 1;
  }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const smooth = (a, b, v) => {
    const t = clamp((v - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  WD.hash = hash; WD.rng = rng; WD.noise1 = noise1; WD.clamp = clamp; WD.smooth = smooth;

  /* ---------- SVG path → polylines ---------- */
  function parsePath(d, step) {
    const toks = d.match(/[MmLlHhVvCcSsQqTtZz]|-?\d*\.?\d+(?:e[-+]?\d+)?/g) || [];
    let i = 0, cmd = '', prev = '';
    let x = 0, y = 0, sx = 0, sy = 0, lcx = 0, lcy = 0, lqx = 0, lqy = 0;
    const polys = [];
    let cur = null;
    const num = () => parseFloat(toks[i++]);
    const isCmd = (t) => /^[a-zA-Z]$/.test(t);
    function moveTo(nx, ny) { cur = [[nx, ny]]; polys.push(cur); x = nx; y = ny; sx = nx; sy = ny; }
    function ensure() { if (!cur) { cur = [[x, y]]; polys.push(cur); } }
    function lineTo(nx, ny) {
      ensure();
      const L = Math.hypot(nx - x, ny - y);
      const n = Math.max(1, Math.ceil(L / step));
      for (let k = 1; k <= n; k++) cur.push([x + ((nx - x) * k) / n, y + ((ny - y) * k) / n]);
      x = nx; y = ny;
    }
    function cubic(x1, y1, x2, y2, x3, y3) {
      ensure();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(2, Math.ceil(L / step));
      const x0 = x, y0 = y;
      for (let k = 1; k <= n; k++) {
        const t = k / n, m = 1 - t;
        cur.push([
          m * m * m * x0 + 3 * m * m * t * x1 + 3 * m * t * t * x2 + t * t * t * x3,
          m * m * m * y0 + 3 * m * m * t * y1 + 3 * m * t * t * y2 + t * t * t * y3,
        ]);
      }
      x = x3; y = y3; lcx = x2; lcy = y2;
    }
    function quad(x1, y1, x2, y2) {
      ensure();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1);
      const n = Math.max(2, Math.ceil(L / step));
      const x0 = x, y0 = y;
      for (let k = 1; k <= n; k++) {
        const t = k / n, m = 1 - t;
        cur.push([m * m * x0 + 2 * m * t * x1 + t * t * x2, m * m * y0 + 2 * m * t * y1 + t * t * y2]);
      }
      x = x2; y = y2; lqx = x1; lqy = y1;
    }
    while (i < toks.length) {
      if (isCmd(toks[i])) cmd = toks[i++];
      const rel = cmd === cmd.toLowerCase();
      const C = cmd.toUpperCase();
      const ox = rel ? x : 0, oy = rel ? y : 0;
      switch (C) {
        case 'M': moveTo(num() + ox, num() + oy); cmd = rel ? 'l' : 'L'; break;
        case 'L': lineTo(num() + ox, num() + oy); break;
        case 'H': lineTo(num() + ox, y); break;
        case 'V': lineTo(x, num() + oy); break;
        case 'C': { const a = num() + ox, b = num() + oy, c = num() + ox, e = num() + oy, f = num() + ox, g = num() + oy; cubic(a, b, c, e, f, g); break; }
        case 'S': {
          const rx = prev === 'C' || prev === 'S' ? 2 * x - lcx : x;
          const ry = prev === 'C' || prev === 'S' ? 2 * y - lcy : y;
          const c = num() + ox, e = num() + oy, f = num() + ox, g = num() + oy;
          cubic(rx, ry, c, e, f, g); break;
        }
        case 'Q': { const a = num() + ox, b = num() + oy, c = num() + ox, e = num() + oy; quad(a, b, c, e); break; }
        case 'T': {
          const rx = prev === 'Q' || prev === 'T' ? 2 * x - lqx : x;
          const ry = prev === 'Q' || prev === 'T' ? 2 * y - lqy : y;
          quad(rx, ry, num() + ox, num() + oy); break;
        }
        case 'Z': {
          if (cur) {
            lineTo(sx, sy);
            // ปิดเส้นแบบคนวาด: ลากเลยจุดเริ่มนิดหนึ่ง
            let acc = 0;
            for (let k = 1; k < cur.length && acc < step * 3; k++) {
              acc += Math.hypot(cur[k][0] - cur[k - 1][0], cur[k][1] - cur[k - 1][1]);
              cur.push([cur[k][0], cur[k][1]]);
            }
          }
          cur = null; x = sx; y = sy; break;
        }
        default: i++;
      }
      prev = C;
    }
    return polys.filter((p) => p.length > 0);
  }
  WD.parsePath = parsePath;

  /* ---------- Builder: ประกอบภาพเป็นองค์ประกอบ ---------- */
  class Builder {
    constructor(step) {
      this.step = step || 1;
      this.strokes = [];
      this.comp = '_';
      this.color = null;
      this.lwm = 1;
      this.prefix = '';
      this.sc = 1;
      this.tx = (x, y) => [x, y];
    }
    setTx(fn, sc) { this.tx = fn; this.sc = sc || 1; return this; }
    at(x, y, s) { this.setTx((u, v) => [x + u * s, y + v * s], s); return this; }
    c(comp, color, lwm) { this.comp = comp; this.color = color || null; this.lwm = lwm || 1; return this; }
    _push(polys, extra) {
      for (const p of polys) {
        this.strokes.push(Object.assign({
          pts: p.map((q) => this.tx(q[0], q[1])),
          comp: this.prefix + this.comp,
          color: this.color,
          lwm: this.lwm,
        }, extra || {}));
      }
      return this;
    }
    path(d) { return this._push(parsePath(d, this.step / this.sc)); }
    line(x1, y1, x2, y2) { return this.path(`M${x1} ${y1} L${x2} ${y2}`); }
    ell(cx, cy, rx, ry, a0, sweep) {
      a0 = a0 == null ? -110 : a0;
      sweep = sweep == null ? 378 : sweep;
      const L = (Math.abs(sweep) / 360) * 2 * Math.PI * Math.max(rx, ry);
      const n = Math.max(10, Math.ceil(L / (this.step / this.sc)));
      const pts = [];
      for (let k = 0; k <= n; k++) {
        const a = ((a0 + (sweep * k) / n) * Math.PI) / 180;
        // รัศมีเพี้ยนเล็กน้อยตอนท้าย ให้เหมือนวงกลมที่มือวาด
        const drift = 1 + 0.035 * Math.max(0, (k / n - 0.85) / 0.15);
        pts.push([cx + Math.cos(a) * rx * drift, cy + Math.sin(a) * ry * drift]);
      }
      return this._push([pts]);
    }
    circ(cx, cy, r, a0) { return this.ell(cx, cy, r, r, a0); }
    arc(cx, cy, r, a0, a1) {
      const sweep = a1 - a0;
      const L = (Math.abs(sweep) / 360) * 2 * Math.PI * r;
      const n = Math.max(4, Math.ceil(L / (this.step / this.sc)));
      const pts = [];
      for (let k = 0; k <= n; k++) {
        const a = ((a0 + (sweep * k) / n) * Math.PI) / 180;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }
      return this._push([pts]);
    }
    dot(cx, cy, r) {
      const c = this.tx(cx, cy);
      const pts = [c];
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2;
        pts.push(this.tx(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8));
      }
      this.strokes.push({ pts, comp: this.prefix + this.comp, color: this.color, lwm: this.lwm, dot: r * this.sc, dc: c });
      return this;
    }
    poly(points, close) {
      let d = 'M' + points.map((p) => p.join(' ')).join(' L');
      if (close) d += ' Z';
      return this.path(d);
    }
  }
  WD.Builder = Builder;

  /* ---------- resample + wobble ---------- */
  function resample(pts, sp) {
    if (pts.length < 2) return pts.slice();
    const out = [[pts[0][0], pts[0][1], 0]];
    let s = 0, need = sp;
    for (let i = 1; i < pts.length; i++) {
      const ax = pts[i - 1][0], ay = pts[i - 1][1], bx = pts[i][0], by = pts[i][1];
      const L = Math.hypot(bx - ax, by - ay);
      if (L === 0) continue;
      let t0 = 0;
      while (s + L * (1 - t0) >= need) {
        const t = t0 + (need - s) / L;
        out.push([ax + (bx - ax) * t, ay + (by - ay) * t, need]);
        s = need; t0 = t; need += sp;
        if (t >= 1) break;
      }
      s += L * (1 - t0);
    }
    const last = pts[pts.length - 1];
    const lp = out[out.length - 1];
    if (Math.hypot(last[0] - lp[0], last[1] - lp[1]) > sp * 0.3) out.push([last[0], last[1], s]);
    return out;
  }
  WD.resample = resample;

  // เส้นสั่น: ampS = สั่นถาวร (มือสั่น), ampB = สั่นเฉพาะเฟรม (เส้นเดือด)
  function wobble(pts, o) {
    const sp = o.sp || 1.5;
    const r = resample(pts, sp);
    const wl = o.wl, ss = o.ss | 0, fs = o.fs | 0;
    const out = new Array(r.length);
    const gx = (hash(fs * 13 + ss) - 0.5) * o.ampB * 0.9;
    const gy = (hash(fs * 29 + ss + 5) - 0.5) * o.ampB * 0.9;
    for (let i = 0; i < r.length; i++) {
      const s = r[i][2];
      const dx = o.ampS * (noise1(s / wl, ss) + 0.45 * noise1(s / (wl * 0.27), ss + 7)) +
                 o.ampB * (noise1(s / (wl * 1.3), fs * 31 + ss + 3) + 0.4 * noise1(s / (wl * 0.33), fs * 17 + ss + 9));
      const dy = o.ampS * (noise1(s / wl, ss + 101) + 0.45 * noise1(s / (wl * 0.27), ss + 113)) +
                 o.ampB * (noise1(s / (wl * 1.3), fs * 37 + ss + 41) + 0.4 * noise1(s / (wl * 0.33), fs * 19 + ss + 53));
      out[i] = [r[i][0] + dx + gx, r[i][1] + dy + gy];
    }
    return out;
  }

  /* ---------- เนื้อดินสอฝุ่น ---------- */
  const TILE = 120;
  let lattice = null;

    const a = new Float32Array(P * P);
    const r = rng(seed);
    for (let i = 0; i < a.length; i++) a[i] = r();
    return a;
  }
  function pnoise(L, P, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const x0 = ((xi % P) + P) % P, y0 = ((yi % P) + P) % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = L[y0 * P + x0], b = L[y0 * P + x1], c = L[y1 * P + x0], d = L[y1 * P + x1];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function grainField() {
    if (lattice) return lattice;
    const L3 = plat(40, 11), L8 = plat(15, 23), L2 = plat(60, 37);
    const wn = rng(99);
    const f = new Float32Array(TILE * TILE);
    for (let y = 0; y < TILE; y++)
      for (let x = 0; x < TILE; x++) {
        // เส้นใยกระดาษเฉียงเล็กน้อย + เม็ดฝุ่น
        const fib = pnoise(L2, 60, (x + y * 0.5) / 2, (y - x * 0.25) / 2);
        f[y * TILE + x] = 0.42 * pnoise(L3, 40, x / 3, y / 3) + 0.2 * pnoise(L8, 15, x / 8, y / 8) + 0.2 * fib + 0.18 * wn();
      }
    lattice = f;
    return f;
  }
  const texCache = new Map();
  function hexRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  WD.hexRgb = hexRgb;
  function tile(hex, kind) {
    const key = hex + kind;
    if (texCache.has(key)) return texCache.get(key);
    const f = grainField();
    const c = document.createElement('canvas');
    c.width = c.height = TILE;
    const x = c.getContext('2d');
    const img = x.createImageData(TILE, TILE);
    const [r, g, b] = hexRgb(hex);
    for (let i = 0; i < f.length; i++) {
      const n = f[i];
      let a;
      if (kind === 'core') a = 0.3 + 0.7 * smooth(0.16, 0.58, n);
      else a = 0.55 * smooth(0.52, 0.76, n);
      img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b;
      img.data[i * 4 + 3] = Math.round(a * 255);
    }
    x.putImageData(img, 0, 0);
    texCache.set(key, c);
    return c;
  }
  const patCache = new WeakMap();
  function pattern(ctx, hex, kind, grain) {
    let m = patCache.get(ctx);
    if (!m) { m = new Map(); patCache.set(ctx, m); }
    const key = hex + kind + grain;
    if (m.has(key)) return m.get(key);
    const p = ctx.createPattern(tile(hex, kind), 'repeat');
    if (grain && grain !== 1 && p.setTransform && typeof DOMMatrix !== 'undefined') {
      try { p.setTransform(new DOMMatrix().scale(grain)); } catch (e) {}
    }
    m.set(key, p);
    return p;
  }

  /* ---------- วาดเส้นดินสอ 1 เส้น ----------
     pts: จุดในหน่วย device px
     o: {hex, w, ss, fs, ampS, ampB, wl, grain, dot, dust} */
  function pencilStroke(ctx, pts, o) {
    const core = pattern(ctx, o.hex, 'core', o.grain);
    const fringe = pattern(ctx, o.hex, 'fringe', o.grain);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (o.dot || pts.length < 2 || len < o.w * 0.35) {
      // จุด (แตะทีเดียว / ลูกตา)
      const c = o.dc || pts[0];
      const R = o.dot ? Math.max(o.dot, o.w * 0.5) : o.w * 0.62;
      const jx = (hash(o.fs * 7 + o.ss) - 0.5) * o.ampB, jy = (hash(o.fs * 11 + o.ss) - 0.5) * o.ampB;
      ctx.fillStyle = core;
      for (let k = 0; k < 2; k++) {
        ctx.beginPath();
        const n = 14;
        for (let j = 0; j <= n; j++) {
          const a = (j / n) * Math.PI * 2;
          const rr = R * (1 + 0.14 * noise1(j * 0.9 + k * 3, o.fs * 5 + o.ss));
          const px = c[0] + jx + Math.cos(a) * rr, py = c[1] + jy + Math.sin(a) * rr;
          j ? ctx.lineTo(px, py) : ctx.moveTo(px, py);

        ctx.fill();
      }
      ctx.strokeStyle = fringe;
      ctx.lineWidth = o.w * 0.5;
      ctx.stroke();
      return;
    }
    const sp = Math.max(1, o.sp || 1.6);
    const p1 = wobble(pts, { sp, wl: o.wl, ss: o.ss, fs: o.fs, ampS: o.ampS, ampB: o.ampB });
    ctx.strokeStyle = core;
    ctx.lineWidth = o.w;
    ctx.beginPath();
    ctx.moveTo(p1[0][0], p1[0][1]);
    for (let i = 1; i < p1.length; i++) ctx.lineTo(p1[i][0], p1[i][1]);
    ctx.stroke();
    // ขอบฝุ่น
    const p2 = wobble(pts, { sp: sp * 1.4, wl: o.wl * 0.8, ss: o.ss + 91, fs: o.fs + 57, ampS: o.ampS * 0.8, ampB: o.ampB * 1.1 });
    ctx.strokeStyle = fringe;
    ctx.lineWidth = o.w * 1.75;
    ctx.beginPath();
    ctx.moveTo(p2[0][0], p2[0][1]);
    for (let i = 1; i < p2.length; i++) ctx.lineTo(p2[i][0], p2[i][1]);
    ctx.stroke();
    // ผงดินสอ
    if (o.dust !== false) {
      const r = rng(o.fs * 7919 + o.ss * 31 + 1);
      const [cr, cg, cb] = hexRgb(o.hex);
      ctx.fillStyle = `rgba(${cr},${cg},${cb},0.32)`;
      const every = Math.max(3, Math.round(9 / sp));
      for (let i = 0; i < p1.length; i += every) {
        if (r() < 0.55) continue;
        const a = r() * Math.PI * 2, d = o.w * (0.7 + r() * 0.9);
        const s = Math.max(0.8, o.w * (0.08 + r() * 0.12));

  /* ---------- วาดชุดเส้น (ภาพต้นแบบ/ไอคอน/ภาพผู้เล่น) ----------
     strokes: [{pts:[[x,y]..], color, lwm, dot, dc, w (หน่วย vb), seed}]
     m: {sx, sy, ox, oy}   แปลง vb → device px
     o: {lw (px), ink, palette, fs, seedBase, ampS, ampB, wl, grain, colorOverride} */
  function drawStrokes(ctx, strokes, m, o) {
    for (let i = 0; i < strokes.length; i++) {
      const s = strokes[i];

      const hex = o.colorOverride || (s.color ? (o.palette[s.color] || s.color) : o.ink);
      let w = s.w != null ? s.w * m.sx : o.lw * (s.lwm || 1);
      if (o.minW) w = Math.max(w, o.minW);
      pencilStroke(ctx, pts, {
        hex, w, ss: (s.seed != null ? s.seed : (o.seedBase || 0) + i * 7 + 1),
        fs: o.fs, ampS: o.ampS, ampB: o.ampB, wl: o.wl, grain: o.grain,
        dot: s.dot ? s.dot * m.sx : 0,
        dc: s.dc ? [m.ox + s.dc[0] * m.sx, m.oy + s.dc[1] * m.sy] : null,
        sp: o.sp, dust: o.dust,
      });
    }
  }
  WD.drawStrokes = drawStrokes;
})();

  WD.mashup = function (baseId, faceId, step) {
    const base = WD.BASES.find((x) => x.id === baseId);
    const face = WD.FACES.find((x) => x.id === faceId);
    const b = new WD.Builder(step || 1);
    base.draw(b);
    const [fx, fy, fs] = base.face;
    b.prefix = 'f_';
    b.at(fx, fy, fs);
    face.draw(b, { ax: base.aside[0], ay: base.aside[1], s: fs });
    const comps = {};
    for (const k in base.comps) comps[k] = { name: base.comps[k][0], w: base.comps[k][1] };
    for (const k in face.comps) comps['f_' + k] = { name: face.comps[k][0], w: face.comps[k][1] };
    return { id: baseId + '+' + faceId, base, face, strokes: b.strokes, comps };
  };

   1) ย่อ/ขยาย/เลื่อนภาพผู้เล่นให้ทับภาพต้นแบบ (จัดกรอบให้ตรงกัน)
   2) สร้าง "แผนที่ระยะ" (distance field) ของเส้นทั้งสองฝั่ง
   3) ลองขยับ/ย่อเพิ่มอีกหลายแบบ เลือกแบบที่ทับกันดีที่สุด
   4) องค์ประกอบแต่ละชิ้น: มีเส้นของผู้เล่นผ่านใกล้ ๆ กี่ %  (ความครบ)
      เส้นของผู้เล่นตกอยู่บนต้นแบบกี่ % (ความเรียบร้อย)
   ============================================================ */
(function () {
  const WD = globalThis.WD;
  const CFG = (WD.SCORE_CFG = {
    t0: 0.025,    // ใกล้กว่านี้ = ตรงเต็ม ๆ (หน่วย: สัดส่วนของกระดาน)
    t1: 0.07,     // ไกลกว่านี้ = ไม่นับ
    grid: 120, lo: -0.35, hi: 1.35,
    cLo: 0.2, cHi: 0.7,   // องค์ประกอบ "มี" เมื่อเส้นผ่านใกล้ ๆ ราว 20–70%
    pLo: 0.3, pHi: 0.85,  // ความเรียบร้อย (เส้นเกิน/เส้นมั่ว)
    mix: 0.55,    // สัดส่วน "ครบองค์ประกอบ" : "เหมือนรูปทรง"
    faceW: 2.0,   // ส่วนหน้า (ตัวผสมอิโมจิ) สำคัญกว่าปกติ
    faceTol: 0.7, // ส่วนหน้าเล็ก ต้องวาดตรงกว่า
    inkMax: 2.6,  // หมึกมากเกินต้นแบบกี่เท่าถึงเริ่มหักคะแนน (ระบายสีได้)
    curve: 0.8,   // ยกคะแนนให้ใจดีขึ้น (<1 = ใจดี)
  });

  function softHit(d, tol) {
    tol = tol || 1;
    const a = CFG.t0 * tol, b = CFG.t1 * tol;
    if (d <= a) return 1;
    if (d >= b) return 0;
    return 1 - (d - a) / (b - a);
  }

  function distGrid(pts) {
    const N = CFG.grid, lo = CFG.lo, cell = (CFG.hi - lo) / N;
    const d = new Float32Array(N * N).fill(1e6);
    for (const p of pts) {
      const i = Math.floor((p[0] - lo) / cell), j = Math.floor((p[1] - lo) / cell);
      if (i >= 0 && j >= 0 && i < N && j < N) d[j * N + i] = 0;
    }
    const D = Math.SQRT2;
    for (let j = 0; j < N; j++)
      for (let i = 0; i < N; i++) {
        let v = d[j * N + i];
        if (i > 0) v = Math.min(v, d[j * N + i - 1] + 1);
        if (j > 0) {
          v = Math.min(v, d[(j - 1) * N + i] + 1);
          if (i > 0) v = Math.min(v, d[(j - 1) * N + i - 1] + D);
          if (i < N - 1) v = Math.min(v, d[(j - 1) * N + i + 1] + D);
        }
        d[j * N + i] = v;
      }
    for (let j = N - 1; j >= 0; j--)
      for (let i = N - 1; i >= 0; i--) {
        let v = d[j * N + i];
        if (i < N - 1) v = Math.min(v, d[j * N + i + 1] + 1);
        if (j < N - 1) {
          v = Math.min(v, d[(j + 1) * N + i] + 1);
          if (i < N - 1) v = Math.min(v, d[(j + 1) * N + i + 1] + D);
          if (i > 0) v = Math.min(v, d[(j + 1) * N + i - 1] + D);
        }
        d[j * N + i] = v;
      }
    return function (x, y) {
      const i = Math.floor((x - lo) / cell), j = Math.floor((y - lo) / cell);
      if (i < 0 || j < 0 || i >= N || j >= N) return 1;
      return d[j * N + i] * cell;
    };
  }

  function bbox(pts) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of pts) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  }

  // ทิศของเส้น (0..π) ที่จุด i — ใช้เทียบว่าเส้นวิ่งไปทางเดียวกันไหม
  const NB = 6;
  function withAngles(r, scale) {
    const out = [];
    for (let i = 0; i < r.length; i++) {
      const a = r[Math.max(0, i - 2)], b = r[Math.min(r.length - 1, i + 2)];
      let th = Math.atan2(b[1] - a[1], b[0] - a[0]);
      if (th < 0) th += Math.PI;
      if (th >= Math.PI) th -= Math.PI;
      out.push([r[i][0] * scale, r[i][1] * scale, r.length > 2 ? th : -1]);
    }
    return out;
  }
  // แผนที่ระยะแยกตามทิศเส้น 6 ทิศ + แบบรวมทุกทิศ
  function orientedGrids(pts) {
    const bins = [];
    for (let b = 0; b < NB; b++) bins.push([]);
    for (const p of pts) {
      if (p[2] < 0) { for (let b = 0; b < NB; b++) bins[b].push(p); continue; }
      const f = p[2] / (Math.PI / NB), b0 = Math.floor(f) % NB, b1 = (b0 + 1) % NB;
      bins[b0].push(p); bins[b1].push(p);
    }
    const g = bins.map(distGrid);
    const all = distGrid(pts);
    return function (x, y, th) {
      if (th < 0) return all(x, y);
      return g[Math.round(th / (Math.PI / NB)) % NB](x, y);
    };
  }

  // จุดตัวอย่างของภาพต้นแบบ (0..1) พร้อมชื่อองค์ประกอบ
  function refSamples(m) {
    if (m._samples) return m._samples;
    const out = [];
    for (const s of m.strokes) {
      if (s.dot) {
        out.push([s.dc[0] / 100, s.dc[1] / 100, -1, s.comp]);
        continue;
      }
      for (const p of withAngles(WD.resample(s.pts, 1.4), 0.01)) out.push([p[0], p[1], p[2], s.comp]);
    }
    m._samples = out;
    return out;
  }

  function refInk(m) {
    if (m._ink) return m._ink;
    let L = 0;
    for (const s of m.strokes) {
      if (s.dot) { L += 0.02; continue; }
      for (let i = 1; i < s.pts.length; i++) L += Math.hypot(s.pts[i][0] - s.pts[i - 1][0], s.pts[i][1] - s.pts[i - 1][1]) / 100;
    }
    return (m._ink = L);
  }

  function userSamples(strokes) {
    const out = [];
    let ink = 0;
    for (const s of strokes) {
      if (!s.pts.length) continue;
      const r = WD.resample(s.pts, 0.006);
      if (s.pts.length === 1 || r.length < 3) { out.push([s.pts[0][0], s.pts[0][1], -1]); ink += 0.01; continue; }
      for (const p of withAngles(r, 1)) out.push(p);
      ink += r.length ? r[r.length - 1][2] : 0;
    }
    return { pts: out, ink };
  }

  WD.scoreDrawing = function (userStrokes, m) {
    const ref = refSamples(m);
    const U = userSamples(userStrokes);
    if (U.pts.length < 4 || U.ink < 0.06) return { score: 0, comps: {}, precision: 0 };
    const rb = bbox(ref), ub = bbox(U.pts);
    const rd = Math.hypot(rb.w, rb.h), ud = Math.max(0.02, Math.hypot(ub.w, ub.h));
    const k = rd / ud;
    // จัดกรอบภาพผู้เล่นให้ตรงกรอบต้นแบบ
    const Un = U.pts.map((p) => [(p[0] - ub.cx) * k + rb.cx, (p[1] - ub.cy) * k + rb.cy, p[2]]);
    const DTr = orientedGrids(ref), DTu = orientedGrids(Un);
    const stride = Math.max(1, Math.floor(Un.length / 900));
    const Usub = [];
    for (let i = 0; i < Un.length; i += stride) Usub.push(Un[i]);

    const compIds = Object.keys(m.comps);
    const byComp = {};
    for (const c of compIds) byComp[c] = [];
    for (const r of ref) if (byComp[r[3]]) byComp[r[3]].push(r);

    const tolOf = {}, wOf = {};
    let wsum2 = 0;
    for (const c of compIds) {
      const face = c.startsWith('f_');
      tolOf[c] = face ? CFG.faceTol : 1;
      wOf[c] = m.comps[c].w * (face ? CFG.faceW : 1);
      wsum2 += wOf[c];
    }
    const cx = rb.cx, cy = rb.cy;
    function evaluate(s, ax, dx, dy) {
      const sx = s * ax, sy = s / ax;
      // ความเรียบร้อย: เส้นผู้เล่นตกบนต้นแบบ
      let P = 0;
      for (const p of Usub) P += softHit(DTr(cx + (p[0] - cx) * sx + dx, cy + (p[1] - cy) * sy + dy, p[2]));
      P /= Usub.length;
      // ความครบ: แต่ละองค์ประกอบมีเส้นผู้เล่นผ่านไหม
      const rec = {};
      let C = 0, Rw = 0;
      const g = Math.sqrt(sx * sy);
      for (const c of compIds) {
        const arr = byComp[c];
        let h = 0;
        for (const r of arr) {
          const ux = cx + (r[0] - dx - cx) / sx, uy = cy + (r[1] - dy - cy) / sy;
          h += softHit(DTu(ux, uy, r[2]) * g, tolOf[c]);
        }
        const rc = arr.length ? h / arr.length : 0;
        rec[c] = rc;
        C += wOf[c] * WD.smooth(CFG.cLo, CFG.cHi, rc);
        Rw += wOf[c] * rc;
      }
      C /= wsum2; Rw /= wsum2;
      const S = (CFG.mix * C + (1 - CFG.mix) * Rw) * (0.3 + 0.7 * WD.smooth(CFG.pLo, CFG.pHi, P));
      return { S, P, rec, C, Rw, s, ax, dx, dy };
    }
    let best = null;
    const keep = (r) => { if (!best || r.S > best.S) best = r; };
    // ค้นหยาบ แล้วค้นละเอียดรอบ ๆ จุดที่ดีที่สุด
    for (const s of [0.84, 0.95, 1.06, 1.2])
      for (const ax of [0.88, 1, 1.13])
        for (const dx of [-0.08, 0, 0.08])
          for (const dy of [-0.08, 0, 0.08]) keep(evaluate(s, ax, dx, dy));
    const b0 = best;
    for (const fs of [0.95, 1, 1.05])
      for (const fa of [0.95, 1, 1.05])
        for (const ddx of [-0.04, 0, 0.04])
          for (const ddy of [-0.04, 0, 0.04]) keep(evaluate(b0.s * fs, b0.ax * fa, b0.dx + ddx, b0.dy + ddy));
    let score = Math.round(100 * Math.pow(Math.max(0, best.S), CFG.curve));
    if (U.ink < 0.25) score = Math.round(score * (U.ink / 0.25));
    const ratio = (U.ink * k) / refInk(m);
    if (ratio > CFG.inkMax) score = Math.round(score * WD.clamp(1 - (ratio - CFG.inkMax) * 0.12, 0.45, 1));
    return { score: WD.clamp(score, 0, 100), comps: best.rec, precision: best.P, C: best.C, Rw: best.Rw, inkRatio: ratio };
  };
})();

/* ============================================================
   audio.js — เสียงทั้งหมดสังเคราะห์สด ๆ ด้วย Web Audio (ไม่มีไฟล์เสียง)
   - เสียงดินสอขูดกระดาษตอนลากเส้น (noise + bandpass ตามความเร็ว)
   - โน้ตเบา ๆ ระหว่างวาด
   - เปลี่ยนเส้นที่วาดเป็นเพลง: แกน y = เสียงสูงต่ำ (สเกลเพนทาโทนิก)
     สีดินสอ = เครื่องดนตรี, ทุกเส้นใหม่ = เปลี่ยนคอร์ดเบส
   ============================================================ */
(function () {
  const WD = globalThis.WD;
  const A = (WD.audio = { ctx: null, on: true });
  const PENTA = [0, 2, 4, 7, 9];
  const ROOT = 55; // G3
  const BASS = [43, 38, 40, 36]; // G D E C (G–D–Em–C)
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  try { A.on = localStorage.getItem('wd-sound') !== 'off'; } catch (e) {}

  function impulse(ctx, sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec);
    const b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
    return b;
  }

  A.init = function () {
    if (A.ctx) {
      if (A.ctx.state !== 'running') A.ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const ctx = (A.ctx = new AC());
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    const master = (A.master = ctx.createGain());
    master.gain.value = A.on ? 0.9 : 0;
    master.connect(comp); comp.connect(ctx.destination);
    const conv = ctx.createConvolver();
    conv.buffer = impulse(ctx, 1.8, 2.6);
    const wet = ctx.createGain(); wet.gain.value = 0.2;
    conv.connect(wet); wet.connect(master);
    A.bus = ctx.createGain(); A.bus.connect(master); A.bus.connect(conv);
    // ปลดล็อกเสียงบน iOS
    const sb = ctx.createBuffer(1, 1, 22050), ss = ctx.createBufferSource();
    ss.buffer = sb; ss.connect(ctx.destination); try { ss.start(0); } catch (e) {}
    // เสียงดินสอ
    const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    let last = 0;
    for (let i = 0; i < nd.length; i++) {
      const w = Math.random() * 2 - 1;
      last = last * 0.55 + w * 0.45;
      nd[i] = (Math.random() < 0.004 ? w * 2.2 : last); // มีเม็ดกระดาษกระทบเป็นระยะ
    }
    const src = ctx.createBufferSource();
    src.buffer = nb; src.loop = true;
    const bp = (A.scrF = ctx.createBiquadFilter());
    bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.8;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
    const g = (A.scrG = ctx.createGain()); g.gain.value = 0;
    src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
    try { src.start(); } catch (e) {}
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
  };

  A.setOn = function (on) {
    A.on = on;
    try { localStorage.setItem('wd-sound', on ? 'on' : 'off'); } catch (e) {}
    if (A.master) A.master.gain.setTargetAtTime(on ? 0.9 : 0, A.ctx.currentTime, 0.03);
  };

  /* ---------- เสียงดินสอขูด ---------- */
  A.scratch = function (speed) {
    if (!A.ctx || !A.scrG) return;
    const t = A.ctx.currentTime;
    const v = Math.min(0.34, Math.max(0, speed - 0.02) * 0.28) * (0.8 + Math.random() * 0.4);
    A.scrG.gain.setTargetAtTime(v, t, 0.025);
    A.scrF.frequency.setTargetAtTime(1900 + Math.min(speed, 3) * 900 + Math.random() * 300, t, 0.05);
  };
  A.scratchStop = function () {
    if (!A.ctx || !A.scrG) return;
    A.scrG.gain.setTargetAtTime(0, A.ctx.currentTime, 0.04);
  };

  /* ---------- เครื่องดนตรี ---------- */
  function out(t, pan, dest) {
    const g = A.ctx.createGain();
    let node = g;
    if (A.ctx.createStereoPanner) {
      const p = A.ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan || 0));
      g.connect(p); p.connect(dest || A.bus);
    } else g.connect(dest || A.bus);
    return node;
  }
  function osc(type, f, t, end, dest, gain) {
    const o = A.ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (gain != null) {
      const g = A.ctx.createGain(); g.gain.value = gain; o.connect(g); g.connect(dest);
    } else o.connect(dest);
    o.start(t); o.stop(end);
    return o;
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    return t + a + d + 0.05;
  }
  const INST = {
    piano(f, t, v, g) { const e = env(g, t, 0.006, v, 1.1); osc('triangle', f, t, e, g); osc('sine', f * 2, t, e, g, 0.3); osc('sine', f * 3, t, e, g, 0.08); },
    ranat(f, t, v, g) { // ระนาด
      const e = env(g, t, 0.003, v, 0.55); osc('sine', f, t, e, g);
      const g2 = A.ctx.createGain(); g2.connect(g); env(g2, t, 0.002, 0.35, 0.12); osc('sine', f * 3.93, t, e, g2);
    },
    kalimba(f, t, v, g) { const e = env(g, t, 0.004, v, 0.9); osc('sine', f, t, e, g); osc('sine', f * 5.4, t, e, g, 0.1); },
    bell(f, t, v, g) {
      const e = env(g, t, 0.003, v * 0.8, 1.7);
      const car = A.ctx.createOscillator(); car.frequency.value = f * 2; car.connect(g);
      const mod = A.ctx.createOscillator(); mod.frequency.value = f * 2 * 3.5;
      const mg = A.ctx.createGain(); mg.gain.setValueAtTime(f * 4, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.2);
      mod.connect(mg); mg.connect(car.frequency);
      car.start(t); mod.start(t); car.stop(e); mod.stop(e);
    },
    flute(f, t, v, g) { // ขลุ่ย
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v * 0.8, t + 0.06);
      g.gain.setValueAtTime(v * 0.8, t + 0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      const o = osc('sine', f * 2, t, t + 0.6, g);
      const l = A.ctx.createOscillator(); l.frequency.value = 5.5;
      const lg = A.ctx.createGain(); lg.gain.value = f * 0.012; l.connect(lg); lg.connect(o.frequency);
      l.start(t); l.stop(t + 0.6);
      osc('sine', f * 4, t, t + 0.6, g, 0.08);
    },
    khim(f, t, v, g) { // ขิม
      const e = env(g, t, 0.002, v * 0.7, 0.8);
      const lp = A.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2;
      lp.frequency.setValueAtTime(5200, t); lp.frequency.exponentialRampToValueAtTime(700, t + 0.5);
      lp.connect(g);
      osc('sawtooth', f, t, e, lp); osc('sawtooth', f * 1.004, t, e, lp, 0.6);
    },
    pad(f, t, v, g) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v * 0.6, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      osc('triangle', f * 0.997, t, t + 1.15, g); osc('triangle', f * 1.003, t, t + 1.15, g); osc('sine', f * 2, t, t + 1.15, g, 0.2);
    },
    musicbox(f, t, v, g) { const e = env(g, t, 0.002, v * 0.8, 0.9); osc('sine', f * 2, t, e, g); osc('sine', f * 4, t, e, g, 0.22); },
    wood(f, t, v, g) { // โปงลาง/ไม้
      const e = env(g, t, 0.002, v, 0.28);
      const o = A.ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.02);
      o.connect(g); o.start(t); o.stop(e);
      osc('triangle', f * 2.76, t, t + 0.08, g, 0.25);
    },
  };
  A.note = function (inst, midi, t, vel, pan, dest) {
    if (!A.ctx || !A.on) return;
    const g = out(t, pan, dest);
    (INST[inst] || INST.piano)(hz(midi), t, vel, g);
  };
  const instOf = (colorId) => (WD.COLORS.find((c) => c.id === colorId) || WD.COLORS[0]).inst;
  A.instOf = instOf;
  const degreeMidi = (deg) => ROOT + 12 * Math.floor(deg / 5) + PENTA[((deg % 5) + 5) % 5];
  A.yToMidi = (y) => degreeMidi(Math.round((1 - y) * 13));

  // โน้ตเล็ก ๆ ตอนลากเส้น
  A.blip = function (colorId, y, x) {

   gif.js — ตัวเข้ารหัส GIF แบบเคลื่อนไหว (เขียนเอง ไม่พึ่งไลบรารี)

  function ringPts(cx, cy, r) {
    const out = [];

    return out;
  }
  function drawPlayhead(ctx, W, dpr, play, ox, oy) {
    ox = ox || 0; oy = oy || 0;
    const t = play.ctl.now();
    const ev = play.ctl.events;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i], age = t - e.t;
      if (age < 0) break;
      if (age > 0.7) continue;
      const hex = WD.PAL[e.c] || WD.INK;
      ctx.globalAlpha = Math.max(0, 1 - age / 0.7);
      WD.pencilStroke(ctx, ringPts(ox + e.x * W, oy + e.y * W, W * (0.018 + age * 0.06)), {
        hex, w: Math.max(1.2, W * 0.005), ss: i * 13 + 5, fs: frame * 1000 + 3,
        ampS: W * 0.001, ampB: W * 0.0012, wl: W * 0.03, grain: dpr * 0.85, sp: 1.3 * dpr, dust: false,
      });
    }
    ctx.globalAlpha = 1;
    let cur = null;
    for (let i = 0; i < ev.length && ev[i].t <= t; i++) cur = ev[i];
    if (cur && t < play.ctl.dur - 0.5) {
      WD.pencilStroke(ctx, [[ox + cur.x * W, oy + cur.y * W]], {
        hex: WD.INK, w: W * 0.022, ss: 7, fs: frame * 1000 + 3, ampS: 0, ampB: W * 0.001, wl: 10, grain: dpr * 0.85,
      });
    }
  }
  function startPlayback(strokes, ctx, getBox, onEnd) {

    const loop = () => {
      const b = getBox();
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      if (ctl.stopped) return;
      if (ctl.now() < ctl.dur) {
        drawPlayhead(ctx, b.W, b.dpr, play, b.ox, b.oy);
        play.raf = requestAnimationFrame(loop);
      } else {

        if (onEnd) onEnd();
      }
    };
    play.stop = () => {
      ctl.stop();
      cancelAnimationFrame(play.raf);
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    };
    play.raf = requestAnimationFrame(loop);
    return play;
  }

  async function fontReady() { try { if (document.fonts) await document.fonts.load('40px "Wadkhen"'); } catch (e) {} }
  function mkCanvas(w, h, rf) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d', rf ? { willReadFrequently: true } : undefined); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); return [c, x]; }

  function drawRefAt(ctx, m, x, y, size, f) {

      lw: Math.max(1.2, 2.3 * size / 100), ink: WD.INK, palette: WD.PAL, fs: f * 1000 + 3,
      ampS: size * 0.004, ampB: size * 0.003, wl: Math.max(5, size * 0.06), grain: 1.1, sp: 1.3, seedBase: 11,
    });

      lw, ink: color, palette: WD.PAL, fs: f * 1000 + 3, ampS: 1, ampB: 0.8, wl: 14, grain: 1.1, sp: 1.5, seedBase: 21, dust: false,
    });

  function truncate(strokes, upto) {
    const out = [];
    let acc = 0;
    for (const s of strokes) {
      let L = 0;
      for (let i = 1; i < s.pts.length; i++) L += Math.hypot(s.pts[i][0] - s.pts[i - 1][0], s.pts[i][1] - s.pts[i - 1][1]);
      L = Math.max(L, 0.004);
      if (acc + L <= upto) { out.push(s); acc += L; continue; }
      const need = upto - acc;
      if (need > 0) {
        const pts = [s.pts[0]];
        let d = 0;
        for (let i = 1; i < s.pts.length; i++) {
          const seg = Math.hypot(s.pts[i][0] - s.pts[i - 1][0], s.pts[i][1] - s.pts[i - 1][1]);
          if (d + seg > need) break;
          d += seg; pts.push(s.pts[i]);

    return t;
  }

  async function makePng(r) {
    await fontReady();
    const S = 1080, F = 170;
    const [c, ctx] = mkCanvas(S, S + F);
    const M = 60, D = S - M * 2;
    drawFrameAt(ctx, M - 14, M - 14, D + 28, D + 28, '#d6d4cc', 2.2, 0);
    (r.strokes || []).forEach((s) => drawUserStroke(ctx, s, 0, D, 1.6, M, M));
    text(ctx, r.m.base.name + ' + ' + r.m.face.name, M, S + 62, 52, '#1e1e1e', 'left', 1.6);
    text(ctx, 'วาดได้ได้รางวัลบรม   ค่ายเพชรบุรี', M, S + 116, 34, '#8e8c84', 'left', 0.6);
    drawRefAt(ctx, r.m, S - M - 150, S - 4, 150, 0);

  }
  async function makeGif(r, progress) {
    await fontReady();
    const S = 440, F = 76, M = 22, D = S - M * 2;
    const [c, ctx] = mkCanvas(S, S + F, true);
    const pal = WD.gifPalette(WD.COLORS.map((x) => x.hex).concat(['#d6d4cc', '#8e8c84']));
    const gw = WD.GifWriter(S, S + F, pal);
    const strokes = r.strokes || [];
    const total = inkLength(strokes);
    const N = WD.clamp(Math.round(total / 0.1), 14, 40);
    const HOLD = 12;
    for (let i = 1; i <= N + HOLD; i++) {
      const f = i % 3;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S + F);
      drawFrameAt(ctx, M - 8, M - 8, D + 16, D + 16, '#d6d4cc', 1.4, f);
      const part = i >= N ? strokes : truncate(strokes, (total * i) / N);
      part.forEach((s) => drawUserStroke(ctx, s, f, D, 1, M, M));
      text(ctx, r.m.base.name + ' + ' + r.m.face.name, M, S + 30, 24, '#1e1e1e', 'left', 0.8);
      text(ctx, 'วาดได้ได้รางวัลบรม', M, S + 60, 18, '#8e8c84', 'left', 0.3);
      drawRefAt(ctx, r.m, S - M - 64, S + 4, 64, f);
      gw.addFrame(ctx.getImageData(0, 0, S, S + F).data, i < N ? 8 : 14);
      if (i % 2 === 0) { if (progress) progress(i / (N + HOLD)); await sleep(0); }
    }
    return new Blob([gw.finish()], { type: 'image/gif' });
  }
  async function makeCollage() {
    await fontReady();
    const W = 1080, H = 1350;
    const [c, ctx] = mkCanvas(W, H);
    text(ctx, 'วาดได้ได้รางวัลบรม', W / 2, 108, 76, '#1e1e1e', 'center', 2.4);
    text(ctx, 'ค่ายเพชรบุรี', W / 2, 158, 34, '#8e8c84', 'center', 0.6);
    text(ctx, 'คะแนน', W / 2, 232, 36, '#57564f', 'center', 0.8);
    text(ctx, String(G.total), W / 2, 432, 300, '#1e1e1e', 'center', 7);
    const ps = prizeSpec(G.tier), ph = 120, pw = ph * ps.vb[0] / ps.vb[1];
    const sc = ph / ps.vb[1];
    WD.drawStrokes(ctx, ps.strokes, { sx: sc, sy: sc, ox: (W - pw) / 2, oy: 462 }, {
      lw: 5 * sc * 1.1, ink: WD.INK, palette: WD.PAL, fs: 3, ampS: 1.1, ampB: 0.9, wl: 12, grain: 1.1, sp: 1.3, seedBase: 31,
    });
    text(ctx, G.tier.title, W / 2, 648, 58, '#1e1e1e', 'center', 1.8);
    text(ctx, G.tier.item, W / 2, 698, 34, '#57564f', 'center', 0.7);
    const T = 250, gap = 26;
    const rows = [G.rounds.slice(0, 3), G.rounds.slice(3)];
    let y = 744;
    rows.forEach((row) => {
      const rowW = row.length * T + (row.length - 1) * gap;
      let x = (W - rowW) / 2;
      row.forEach((r) => {
        drawFrameAt(ctx, x, y, T, T, '#d6d4cc', 2, 0);
        (r.strokes || []).forEach((s) => drawUserStroke(ctx, s, 0, T - 24, 1, x + 12, y + 12));
        drawRefAt(ctx, r.m, x + T - 62, y + T - 62, 54, 0);
        x += T + gap;
      });
      y += T + gap;
    });
    return new Promise((res) => c.toBlob((b) => res(b), 'image/png'));
  }
  let exportUrl = null;
  async function deliver(blob, filename) {
    if (!blob) { toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
    if (DL) {
      try { await DL.save({ filename, data: blob }); toast('บันทึกแล้ว'); return; }
      catch (e) {
        const code = e && e.code;
        if (code === 'declined') return;
        if (code === 'rate_limited') { toast('รอสักครู่แล้วลองใหม่'); return; }
      }
    }
    if (exportUrl) URL.revokeObjectURL(exportUrl);
    exportUrl = URL.createObjectURL(blob);
    $('#exImg').src = exportUrl;
    const a = $('#exLink');
    a.href = exportUrl;
    a.setAttribute('download', filename);
    openSheet('exportSheet');
  }
  async function busy(btn, label, job) {
    if (btn.disabled) return;
    const sp = $('span', btn), old = sp.textContent;
    btn.disabled = true;
    sp.textContent = label;
    try { await job((p) => { sp.textContent = label + ' ' + Math.round(p * 100) + '%'; }); }
    catch (e) { console.error(e); toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); }
    finally { btn.disabled = false; sp.textContent = old; }
  }
  $('#vPng').addEventListener('click', (e) => busy(e.currentTarget, 'กำลังทำ', async () => {
    const r = G.rounds[viewerIdx];
    await deliver(await makePng(r), slug(r) + '.png');
  }));
  $('#vGif').addEventListener('click', (e) => busy(e.currentTarget, 'กำลังทำ', async (p) => {
    const r = G.rounds[viewerIdx];
    await deliver(await makeGif(r, p), slug(r) + '.gif');
  }));
  $('#saveAllBtn').addEventListener('click', (e) => busy(e.currentTarget, 'กำลังทำ', async () => {
    await deliver(await makeCollage(), 'วาดได้ได้รางวัลบรม-' + G.total + 'คะแนน.png');
  }));
  $('#exLink').addEventListener('click', (e) => { if (!exportUrl) e.preventDefault(); });

  /* ================= ป๊อปอัป & ข้อความสั้น ================= */
  function openSheet(id) { const s = $('#' + id); s.classList.add('on'); scan(s); }
  function closeSheet(id) {
    $('#' + id).classList.remove('on');
    if (id === 'viewer') stopViewerPlay();
  }
  $$('.sheet').forEach((s) => {
    s.addEventListener('click', (e) => {
      if (e.target === s || e.target.closest('[data-close]')) closeSheet(s.id);
    });
  });
  let toastT = 0;
  function toast(msg) {
    const t = $('#toast');
    $('#toastTx').textContent = msg;
    t.classList.add('on');
    repaint($('.bg', t));
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('on'), 1700);
  }

  /* ================= ปุ่มต่าง ๆ ================= */
  function syncSound() { $$('.snd .dd').forEach((el) => setIcon(el, WD.audio.on ? 'soundOn' : 'soundOff')); }
  $$('.snd').forEach((b) => b.addEventListener('click', () => {
    WD.audio.init();
    WD.audio.setOn(!WD.audio.on);
    syncSound();
    if (WD.audio.on) WD.audio.tap();
  }));
  $('#startBtn').addEventListener('click', startGame);
  $('#doneBtn').addEventListener('click', onDone);
  $('#undoBtn').addEventListener('click', undo);
  $('#clearBtn').addEventListener('click', clearBoard);
  $('#sizeBtn').addEventListener('click', () => {
    Board.sizeIdx = (Board.sizeIdx + 1) % CONFIG.SIZES.length;
    setIcon($('#sizeIc'), Board.sizeIdx ? 'sizeL' : 'sizeS');
  });
  $('#quitBtn').addEventListener('click', () => {
    if (G.i > 0 || Board.strokes.length) openSheet('quitSheet');
    else goHome();
  });
  $('#quitYes').addEventListener('click', () => { closeSheet('quitSheet'); goHome(); });
  $('#homeBtn').addEventListener('click', goHome);
  $('#againBtn').addEventListener('click', startGame);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b && !b.disabled && !b.classList.contains('sw') && b.id !== 'doneBtn') WD.audio.tap();
  });
  document.addEventListener('pointerdown', () => WD.audio.init(), { once: true, capture: true });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && G.screen === 'game') { e.preventDefault(); undo(); }
    if (e.key === 'Escape') $$('.sheet.on').forEach((s) => closeSheet(s.id));
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) WD.audio.scratchStop(); });

  /* ================= เริ่ม ================= */
  buildColors();
  buildSteps();
  syncSound();
  updateTools();
  scan(document);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitBoard(); });
  WD.app = { G, Board, CONFIG, startGame, onDone, nextRound, showResult, makeGif, makePng, makeCollage, repaint };
})();

</script>
</body>
</html>
